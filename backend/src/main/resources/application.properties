# Ferretería Guillermo - configuración sin credenciales en el repositorio
spring.application.name=ferreteria-guillermo-api
server.port=${PORT:8080}

# PostgreSQL: la URL de JDBC comienza con jdbc:postgresql://
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/ferreteria_guillermo}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Frontend autorizado para cookies de sesión y CORS (sin barra final)
app.cors.allowed-origins=${FRONTEND_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}

# Gmail: nunca guardar aquí el correo ni la contraseña
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
app.mail.to=${MAIL_TO:}
app.mail.enabled=${MAIL_ENABLED:false}

# Yape directo. QR visible públicamente en frontend/public/images/yape-qr.png
yape.owner-name=${YAPE_OWNER_NAME:Ferretería Guillermo}
yape.phone=${YAPE_PHONE:}
yape.qr-url=${YAPE_QR_URL:/images/yape-qr.png}

# Recomendaciones con IA (Groq o xAI)
recommendations.ai.enabled=${AI_RECOMMENDATIONS_ENABLED:false}
recommendations.ai.provider=${AI_PROVIDER:groq}
recommendations.ai.key=${AI_API_KEY:}
recommendations.ai.model=${AI_MODEL:llama-3.3-70b-versatile}
